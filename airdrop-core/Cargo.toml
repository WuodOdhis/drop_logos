[package]
name = "airdrop-core"
version = "0.1.0"
edition = "2024"
description = "Shared no_std types for the private airdrop: distribution state, instructions, PDA seeds, Sparse Merkle Tree."
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
std = []

[dependencies]
borsh = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
bytemuck = { version = "1.24", default-features = false }
sha2 = { version = "0.10", default-features = false }
rust-poseidon-bn254-pure = { git = "https://github.com/logos-storage/rust-poseidon-bn254-pure", rev = "49e1042", default-features = false }

[dev-dependencies]
bincode = "1.3"
