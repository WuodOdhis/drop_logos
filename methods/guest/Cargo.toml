[workspace]
resolver = "3"
members = ["."]

# Do NOT add a custom [profile.release] for the guest until precompile-
# patched crates (substrate-bn / sha2 / crypto-bigint) are in place. Default
# profile is the only currently-working configuration; the Initialize
# instruction must stay well under the sequencer's 2^25-cycle session limit.

[package]
name = "airdrop_guest"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
nssa_core = { package = "lee_core", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc6", default-features = false }
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc6" }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc6" }
borsh = { version = "1", default-features = false, features = ["derive"] }
risc0-zkvm = { version = "3.0.5", default-features = false }
airdrop-core = { path = "../../airdrop-core", default-features = false }
# spel-framework must target the SAME lee_core as the guest (v0.2.0-rc6). This
# rev is the one logos-lez-rln pins on rc6.
spel-framework = { git = "https://github.com/0x-r4bbit/spel.git", rev = "91023c9115bf88173b0d25d2e905f2a55ef0313b" }

[[bin]]
name = "airdrop"
path = "src/bin/airdrop.rs"

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
large_enum_variant = "deny"
wildcard_enum_match_arm = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
