[workspace]
resolver = "3"
members = [
  "airdrop-core",
]

[package]
name = "airdrop"
version = "0.1.0"
edition = "2024"

[lib]
name = "airdrop"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
airdrop-core = { path = "airdrop-core" }

# LSSA dependencies fetched as git deps pinned to upstream rc6 (renamed
# nssa->lee, nssa_core->lee_core). Pinned by tag so a fresh clone builds with
# no sibling checkout.
nssa = { package = "lee", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc6" }
nssa_core = { package = "lee_core", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc6" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc6" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc6" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc6", features = ["client"] }
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc6" }
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc6" }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc6" }

# SPEL macro framework (IDL generation for the airdrop program).
spel-framework = { git = "https://github.com/0x-r4bbit/spel.git", rev = "91023c9115bf88173b0d25d2e905f2a55ef0313b" }

# External dependencies
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }
hex = "0.4.3"
borsh = { version = "1", features = ["derive"] }
bytemuck = "1.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "airdrop_enroll"
path = "src/bin/airdrop_enroll.rs"

[[bin]]
name = "airdrop_deploy"
path = "src/bin/airdrop_deploy.rs"

[[bin]]
name = "airdrop_fund"
path = "src/bin/airdrop_fund.rs"

[[bin]]
name = "airdrop_claim"
path = "src/bin/airdrop_claim.rs"

[[bin]]
name = "airdrop_status"
path = "src/bin/airdrop_status.rs"

[[bin]]
name = "generate_idl"
path = "generate_idl.rs"

[dev-dependencies]
sha2 = "0.10"
nssa = { package = "lee", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc6" }
nssa_core = { package = "lee_core", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc6" }
bytemuck = "1.24"

[workspace.dependencies]
airdrop-core = { path = "airdrop-core", default-features = false }

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
large_enum_variant = "deny"
wildcard_enum_match_arm = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
